<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASTRA / New Tab</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0a0a0c;
  --text: #f5f3ef;
  --muted: #77777f;
  --line: #24242a;
  --card: #111115;
  --accent: #d6ff4b;
  --accent-text: #10120a;
}

body.light {
  --bg: #f4f3ef;
  --text: #171719;
  --muted: #8b8b91;
  --line: #deddd8;
  --card: #fff;
  --accent: #5c7c00;
  --accent-text: #fff;
}

body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: Manrope, Arial, sans-serif;
  overflow: hidden;
  transition: background .5s, color .5s;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

::selection {
  background: var(--accent);
  color: var(--accent-text);
}

/* BACKGROUND */

.aurora {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: -1;
  overflow: hidden;
}

.aurora:before,
.aurora:after {
  content: "";
  position: absolute;
  border-radius: 50%;
  filter: blur(120px);
  opacity: .07;
  animation: drift 18s ease-in-out infinite alternate;
}

.aurora:before {
  width: 600px;
  height: 600px;
  background: #a78bfa;
  top: -300px;
  left: -200px;
}

.aurora:after {
  width: 500px;
  height: 500px;
  background: #22d3ee;
  bottom: -300px;
  right: -150px;
  animation-delay: -9s;
}

@keyframes drift {
  to {
    transform: translate(80px, 40px) scale(1.1);
  }
}

/* LAYOUT */

.shell {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 28px 34px;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 2px;
}

.logo-mark {
  width: 28px;
  height: 28px;
  border: 1px solid var(--line);
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 11px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 18px;
}

.location {
  color: var(--muted);
  font-family: "DM Mono", monospace;
  font-size: 10px;
  letter-spacing: 1px;
}

.icon {
  width: 34px;
  height: 34px;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: transparent;
  color: var(--text);
  font-size: 14px;
  transition: .2s;
}

.icon:hover {
  border-color: var(--accent);
  transform: rotate(15deg);
}

/* CENTER */

.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding-bottom: 5vh;
}

.overline {
  color: var(--muted);
  font-family: "DM Mono", monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 28px;
}

.time {
  font-size: clamp(80px, 15vw, 170px);
  font-weight: 800;
  letter-spacing: -.095em;
  line-height: .85;
  font-variant-numeric: tabular-nums;
}

.time span {
  display: inline-block;
  color: var(--muted);
  font-weight: 400;
  font-size: .4em;
  letter-spacing: -.04em;
  margin-left: 10px;
  vertical-align: middle;
  opacity: .55;
}

.date {
  color: var(--muted);
  font-size: 12px;
  letter-spacing: .3px;
  margin-top: 25px;
}

/* SEARCH */

.search {
  width: min(100%, 560px);
  margin-top: 48px;
  position: relative;
}

.search input {
  width: 100%;
  height: 58px;
  padding: 0 120px 0 23px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--card);
  color: var(--text);
  outline: none;
  font-size: 13px;
  transition: .25s;
}

.search input::placeholder {
  color: var(--muted);
}

.search input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 8%, transparent);
}

.search-hint {
  position: absolute;
  right: 18px;
  top: 18px;
  color: var(--muted);
  font-family: "DM Mono", monospace;
  font-size: 10px;
  pointer-events: none;
}

.search-hint kbd {
  border: 1px solid var(--line);
  padding: 3px 5px;
  border-radius: 4px;
  margin-left: 5px;
}

/* SHORTCUTS */

.shortcuts {
  display: flex;
  gap: 10px;
  margin-top: 26px;
}

.shortcut {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  text-decoration: none;
  font-size: 11px;
  transition: .2s;
}

.shortcut:hover {
  color: var(--text);
  border-color: var(--accent);
  transform: translateY(-2px);
}

.shortcut b {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}

/* FOOTER */

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--muted);
  font-family: "DM Mono", monospace;
  font-size: 9px;
  letter-spacing: 1px;
}

.footer button {
  border: 0;
  background: none;
  color: var(--muted);
  font: inherit;
  letter-spacing: inherit;
  transition: .2s;
}

.footer button:hover {
  color: var(--text);
}

/* COMMAND PALETTE */

.palette {
  position: fixed;
  inset: 0;
  background: #0008;
  backdrop-filter: blur(12px);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 16vh;
  z-index: 10;
}

.palette.open {
  display: flex;
}

.palette-box {
  width: min(100% - 32px, 520px);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 30px 100px #0008;
}

.palette-search {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 17px 20px;
  border-bottom: 1px solid var(--line);
}

.palette-search span {
  color: var(--muted);
}

.palette-search input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  background: none;
  color: var(--text);
  font-size: 14px;
}

.palette-list {
  padding: 8px;
}

.command {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border: 0;
  border-radius: 9px;
  background: none;
  color: var(--text);
  text-align: left;
  font-size: 12px;
}

.command:hover,
.command.selected {
  background: var(--line);
}

.command-icon {
  width: 24px;
  color: var(--muted);
  font-size: 15px;
}

.command small {
  margin-left: auto;
  color: var(--muted);
  font-family: "DM Mono", monospace;
  font-size: 9px;
}

.palette-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 10px;
}

/* FOCUS MODE */

body.focus .header,
body.focus .footer,
body.focus .date,
body.focus .search,
body.focus .shortcuts,
body.focus .overline {
  display: none;
}

body.focus .center {
  padding-bottom: 0;
}

body.focus .time {
  font-size: clamp(100px, 18vw, 220px);
}

body.focus .time span {
  display: none;
}

/* MOBILE */

@media (max-width: 600px) {
  .shell {
    padding: 20px 18px;
  }

  .location {
    display: none;
  }

  .header-right {
    gap: 10px;
  }

  .time {
    letter-spacing: -.07em;
  }

  .time span {
    font-size: .35em;
    margin-left: 5px;
  }

  .search {
    margin-top: 38px;
  }

  .shortcuts {
    gap: 7px;
  }

  .shortcut {
    padding: 10px 11px;
  }

  .shortcut span {
    display: none;
  }

  .footer {
    font-size: 8px;
  }
}
</style>
</head>

<body>

<div class="aurora"></div>

<div class="shell">

  <header class="header">

    <div class="logo">
      <div class="logo-mark">A</div>
      ASTRA
    </div>

    <div class="header-right">
      <div class="location">
        LOCAL / <span id="timezone">--</span>
      </div>

      <button class="icon" id="theme" title="Toggle theme">
        ☼
      </button>
    </div>

  </header>


  <main class="center">

    <div class="overline">
      Your space on the web
    </div>

    <div class="time" id="time">
      00:00<span id="ampm">AM</span>
    </div>

    <div class="date" id="date">
      Loading...
    </div>


    <form class="search" id="search">

      <input
        id="query"
        placeholder="Search the web..."
        autocomplete="off"
      >

      <div class="search-hint">
        PRESS <kbd>⌘ K</kbd>
      </div>

    </form>


    <div class="shortcuts">

      <a
        class="shortcut"
        href="https://www.youtube.com"
        target="_blank"
      >
        <b>▶</b>
        <span>YouTube</span>
      </a>

      <a
        class="shortcut"
        href="https://github.com"
        target="_blank"
      >
        <b>⌘</b>
        <span>GitHub</span>
      </a>

      <a
        class="shortcut"
        href="https://www.figma.com"
        target="_blank"
      >
        <b>✦</b>
        <span>Figma</span>
      </a>

      <a
        class="shortcut"
        href="https://discord.com"
        target="_blank"
      >
        <b>◉</b>
        <span>Discord</span>
      </a>

    </div>

  </main>


  <footer class="footer">

    <span>ASTRA / 001</span>

    <button id="focus">
      FOCUS MODE ↗
    </button>

  </footer>

</div>


<!-- COMMAND PALETTE -->

<div class="palette" id="palette">

  <div class="palette-box">

    <div class="palette-search">

      <span>⌕</span>

      <input
        id="paletteInput"
        placeholder="Type a command..."
        autocomplete="off"
      >

      <span>ESC</span>

    </div>


    <div class="palette-list" id="commands">

      <button
        class="command"
        data-action="search"
      >
        <span class="command-icon">⌕</span>
        Search the web
        <small>↵</small>
      </button>

      <button
        class="command"
        data-action="focus"
      >
        <span class="command-icon">◌</span>
        Toggle focus mode
        <small>F</small>
      </button>

      <button
        class="command"
        data-action="theme"
      >
        <span class="command-icon">◐</span>
        Change appearance
        <small>T</small>
      </button>

    </div>


    <div class="palette-footer">
      ↑↓ Navigate &nbsp; · &nbsp;
      Enter Select &nbsp; · &nbsp;
      Esc Close
    </div>

  </div>

</div>


<script>

const $ = id => document.getElementById(id);


/* CLOCK */

function updateClock() {

  const now = new Date();

  let h = now.getHours();

  const ampm = h >= 12 ? "PM" : "AM";

  h = h % 12 || 12;

  document.getElementById("time").childNodes[0].textContent =
    String(h).padStart(2, "0") +
    ":" +
    String(now.getMinutes()).padStart(2, "0");

  document.getElementById("ampm").textContent = ampm;

  document.getElementById("date").textContent =
    now.toLocaleDateString([], {
      weekday: "long",
      month: "long",
      day: "numeric",
      year: "numeric"
    });

  document.getElementById("timezone").textContent =
    Intl.DateTimeFormat()
      .resolvedOptions()
      .timeZone
      .split("/")
      .pop()
      .replace("_", " ");
}

updateClock();

setInterval(updateClock, 1000);


/* THEME */

if (localStorage.getItem("astra-theme") === "light") {
  document.body.classList.add("light");
}

$("theme").onclick = () => {

  document.body.classList.toggle("light");

  localStorage.setItem(
    "astra-theme",
    document.body.classList.contains("light")
      ? "light"
      : "dark"
  );

};


/* SEARCH */

function doSearch(value) {

  const q = value.trim();

  if (q) {
    window.location.href =
      "https://www.google.com/search?q=" +
      encodeURIComponent(q);
  }

}

$("search").onsubmit = e => {

  e.preventDefault();

  doSearch($("query").value);

};


/* FOCUS MODE */

function toggleFocus() {

  document.body.classList.toggle("focus");

  localStorage.setItem(
    "astra-focus",
    document.body.classList.contains("focus")
  );

}

if (localStorage.getItem("astra-focus") === "true") {
  document.body.classList.add("focus");
}

$("focus").onclick = toggleFocus;


/* COMMAND PALETTE */

const palette = $("palette");
const paletteInput = $("paletteInput");

let selected = 0;


function openPalette() {

  palette.classList.add("open");

  paletteInput.value = "";

  paletteInput.focus();

  selected = 0;

  updateCommands();

}


function closePalette() {

  palette.classList.remove("open");

}


function updateCommands() {

  document
    .querySelectorAll(".command")
    .forEach((el, i) => {

      el.classList.toggle(
        "selected",
        i === selected
      );

    });

}


function runCommand() {

  const action =
    document
      .querySelectorAll(".command")[selected]
      .dataset.action;


  if (action === "search") {

    closePalette();

    $("query").focus();

  }


  if (action === "focus") {

    closePalette();

    toggleFocus();

  }


  if (action === "theme") {

    closePalette();

    $("theme").click();

  }

}


document
  .querySelectorAll(".command")
  .forEach((el, i) => {

    el.onclick = () => {

      selected = i;

      runCommand();

    };

  });


paletteInput.onkeydown = e => {

  if (e.key === "ArrowDown") {

    e.preventDefault();

    selected = (selected + 1) % 3;

    updateCommands();

  }


  if (e.key === "ArrowUp") {

    e.preventDefault();

    selected = (selected + 2) % 3;

    updateCommands();

  }


  if (e.key === "Enter") {

    runCommand();

  }


  if (e.key === "Escape") {

    closePalette();

  }

};


/* KEYBOARD SHORTCUTS */

document.addEventListener("keydown", e => {

  if (
    (e.ctrlKey || e.metaKey) &&
    e.key.toLowerCase() === "k"
  ) {

    e.preventDefault();

    openPalette();

  }


  if (e.key === "Escape") {

    closePalette();

  }


  if (
    e.key.toLowerCase() === "f" &&
    !e.ctrlKey &&
    !e.metaKey &&
    document.activeElement.tagName !== "INPUT"
  ) {

    toggleFocus();

  }

});

</script>

</body>
</html>
